name: remymy

services:
  # Writes every container's output (these services and the upstream images alike) to a log file per hour:
  # ${LOG_DIR_HOST:-./logs}/<service>/YYYY-MM-DD_HH.log, in UTC. See logging/collect.py.
  log-collector:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/opt/remymy-logging/collect.py"]
    environment:
      COMPOSE_PROJECT: remymy
      LOG_DIR: /var/log/remymy
      LOG_RETENTION_HOURS: ${LOG_RETENTION_HOURS:-168}
    volumes:
      - ./logging/collect.py:/opt/remymy-logging/collect.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${LOG_DIR_HOST:-./logs}:/var/log/remymy"
    networks:
      - remymy

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: remymy-app:dev
    mem_limit: 1024m
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      ENV: ${ENV:-nonprod}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MCP_URL: http://mcp:8000/mcp
      # Inside the Compose network the API is "api"; localhost would be this
      # container itself.
      DATA_API_URL: http://api:8002
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-7ef62aaf-3045-4ad7-ae99-902911322871}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-c5f77a16-7cd1-4a6e-88a0-b04f6cb5453b}
    # Only the Data API: the app never calls mcp or models directly.
    depends_on:
      api:
        condition: service_healthy
    networks:
      - remymy

  api-migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: remymy-api:dev
    mem_limit: 512m
    memswap_limit: 1024m
    restart: "no"
    environment:
      ENV: ${ENV:-nonprod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # loads the recipes into remymy.db: from the old recipe database the first time, or else from the sources
      DATABASE_PATH: /state/remymy.db
      LEGACY_FOOD_DATABASE_PATH: /data/remymy-food.db
      PYTHONPATH: /opt/remymy-api/migrations:/opt/remymy-api/src
      RECIPES_SOURCE: ${RECIPES_SOURCE:-}
      FDC_SOURCE_DIR: ${FDC_SOURCE_DIR:-}
      FDC_RELEASE: ${FDC_RELEASE:-unspecified}
    volumes:
      - "${DATA_DIR:-./data}:/data:ro"
      - remymy-user-data:/state
    command: ["python", "-m", "migrations.bootstrap"]
    networks:
      - remymy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: remymy-api:dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:8002"
    environment:
      ENV: ${ENV:-nonprod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8002
      # the one database: recipes, catalog, users and what they keep
      DATABASE_PATH: /state/remymy.db
      # read once, the first time, when remymy.db has no users yet
      LEGACY_USER_DATABASE_PATH: /state/remymy-users.db
      # db 1 of the shared redis; Langfuse uses db 0
      REDIS_URL: redis://:${REDIS_AUTH:-myredissecret}@redis:6379/1
      SEED_DEMO_USER: ${SEED_DEMO_USER:-true}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - "${DATA_DIR:-./data}:/data:ro"
      - remymy-user-data:/state
      # the classifier's and clusterer's models (GLiNER, stanza, the encoder), downloaded on first use and kept
      - remymy-model-cache:/var/cache/remymy/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      # startup sets the database up; the models load in the background after it
      start_period: 120s
      retries: 5
    networks:
      - remymy

  # mcp and models need files that are not in the repository
  # (data/raw/food-com/RAW_recipes.csv and data/models/$MODEL_FILE), so they
  # only start with --profile recommender. start-all.sh adds it when both exist.
  mcp:
    profiles: [recommender]
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: remymy-mcp:dev
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-nonprod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8000
      MODEL_URL: http://models:8001
      RECIPE_CATALOG_PATH: /data/RAW_recipes.csv
    depends_on:
      models:
        condition: service_healthy
    volumes:
      - "${DATA_DIR:-./data}/raw/food-com/RAW_recipes.csv:/data/RAW_recipes.csv:ro"
    networks:
      - remymy

  models:
    profiles: [recommender]
    build:
      context: ./models
      dockerfile: Dockerfile
    image: remymy-models:dev
    restart: unless-stopped
    ports:
      - "${MODEL_PORT:-8001}:8001"
    environment:
      ENV: ${ENV:-nonprod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8001
      MODEL_ARTIFACT_PATH: /data/models/${MODEL_FILE:-hybrid-foodcom-bpr.npz}
      TOKEN_VOCAB_PATH: /data/raw/food-com/openai-gpt-vocab.json
    volumes:
      - "${DATA_DIR:-./data}:/data:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - remymy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # one redis for both: db 0 is Langfuse's queues and cache, db 1 the API's cache. noeviction because Langfuse's
    # queues must not lose jobs; when it is full the API's cache writes fail and it reads from the database instead.
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:-myredissecret}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH:-myredissecret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - remymy

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:${LANGFUSE_PORT:-3030}}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-postgres}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-remymy-nonprod-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-bc154720b48e07c4e33dfc5d4e65c93ef7a63cd1a947094b0e95be0f043af4ef}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_CONNECTION_STRING: redis://:${REDIS_AUTH:-myredissecret}@redis:6379/0
    networks:
      - remymy

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-remymy-nonprod-nextauth-secret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:${MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: remymy
      LANGFUSE_INIT_ORG_NAME: Remymy
      LANGFUSE_INIT_PROJECT_ID: remymy-pi
      LANGFUSE_INIT_PROJECT_NAME: Remymy Pi Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-7ef62aaf-3045-4ad7-ae99-902911322871}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-c5f77a16-7cd1-4a6e-88a0-b04f6cb5453b}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-remymy@example.com}
      LANGFUSE_INIT_USER_NAME: remymy
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-remymylocal}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://$$(hostname):3000/api/public/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - remymy

  langfuse-gateway:
    build:
      context: ./langfuse-gateway
      dockerfile: Dockerfile
    image: remymy-langfuse-gateway:dev
    restart: unless-stopped
    depends_on:
      langfuse-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3030}:3030"
    environment:
      PORT: 3030
      LANGFUSE_UPSTREAM: http://langfuse-web:3000
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:${LANGFUSE_PORT:-3030}}
      LANGFUSE_LOCAL_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-remymy@example.com}
      LANGFUSE_LOCAL_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-remymylocal}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3030/api/public/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks:
      - remymy

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - remymy

  langfuse-minio:
    # MinIO no longer publishes free images (quay.io and Docker Hub both refuse
    # anonymous pulls), so this is Chainguard's build, pinned to one digest.
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      # The image has no curl or wget, but its sh is bash, which can open TCP.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r status <&3 && [[ $$status == *' 200'* ]]"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - remymy

  langfuse-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - remymy

networks:
  remymy:
    driver: bridge

volumes:
  remymy-user-data:
  remymy-model-cache:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  redis-data:
