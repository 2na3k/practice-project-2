name: remymy

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: remymy-app:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      ENV: ${ENV:-nonprod}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MCP_URL: http://mcp:8000/mcp
      DATA_API_URL: http://api:8002
    depends_on:
      mcp:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - remymy

  api-migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: remymy-api:dev
    restart: "no"
    environment:
      ENV: ${ENV:-nonprod}
      DATABASE_PATH: /data/remymy-food.db
      PYTHONPATH: /opt/remymy-api/migrations:/opt/remymy-api/src
      RECIPES_SOURCE: ${RECIPES_SOURCE:-}
      FDC_SOURCE_DIR: ${FDC_SOURCE_DIR:-}
      FDC_RELEASE: ${FDC_RELEASE:-unspecified}
    volumes:
      - "${DATA_DIR:-./data}:/data"
    command: ["python", "-m", "migrations.bootstrap"]
    networks:
      - remymy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: remymy-api:dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:8002"
    environment:
      ENV: ${ENV:-nonprod}
      HOST: 0.0.0.0
      PORT: 8002
      DATABASE_PATH: /data/remymy-food.db
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    volumes:
      - "${DATA_DIR:-./data}:/data:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - remymy

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: remymy-mcp:dev
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-nonprod}
      HOST: 0.0.0.0
      PORT: 8000
      MODEL_URL: http://models:8001
    depends_on:
      models:
        condition: service_healthy
    networks:
      - remymy

  models:
    build:
      context: ./models
      dockerfile: Dockerfile
    image: remymy-models:dev
    restart: unless-stopped
    ports:
      - "${MODEL_PORT:-8001}:8001"
    environment:
      ENV: ${ENV:-nonprod}
      HOST: 0.0.0.0
      PORT: 8001
      MODEL_ARTIFACT_PATH: /data/models/${MODEL_FILE:-hybrid-foodcom-bpr.npz}
      TOKEN_VOCAB_PATH: /data/raw/food-com/openai-gpt-vocab.json
    volumes:
      - "${DATA_DIR:-./data}:/data:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - remymy

  langflow:
    image: langflowai/langflow:1.12.0
    profiles: ["langflow"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_CONFIG_DIR: /var/lib/langflow
      LANGFLOW_NATIVE_TRACING: "true"
    volumes:
      - langflow-data:/var/lib/langflow
      - ./scripts:/scripts:ro
    networks:
      - remymy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health_check', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 90s
      retries: 10

networks:
  remymy:
    driver: bridge

volumes:
  langflow-data:
