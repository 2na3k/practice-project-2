name: remymy

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: remymy-app:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      ENV: ${ENV:-nonprod}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MCP_URL: http://mcp:8000/mcp
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - remymy

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: remymy-mcp:dev
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-nonprod}
      HOST: 0.0.0.0
      PORT: 8000
    networks:
      - remymy

networks:
  remymy:
    driver: bridge
